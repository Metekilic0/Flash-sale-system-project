name: flash-sale-pipeline

networks:
  pipeline-net:
    driver: bridge

volumes:
  kafka1-data:
  kafka2-data:
  kafka3-data:
  citus-coordinator-data:
  citus-worker1-data:
  citus-worker2-data:
  citus-worker3-data:
  prometheus-data:
  grafana-data:

x-kafka-common: &kafka-common
  image: apache/kafka:3.7.1
  networks: [pipeline-net]
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
    interval: 15s
    timeout: 10s
    retries: 20
    start_period: 30s

services:
  # ── KAFKA 3-broker KRaft cluster ───────────────────────────────────────────
  kafka-1:
    <<: *kafka-common
    container_name: kafka-1
    hostname: kafka-1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    volumes:
      - kafka1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-common
    container_name: kafka-2
    hostname: kafka-2
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-common
    container_name: kafka-3
    hostname: kafka-3
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka3-data:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:3.7.1
    container_name: kafka-init
    networks: [pipeline-net]
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
    entrypoint: ["/bin/bash", "/scripts/init-kafka-topic.sh"]
    environment:
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS}
      KAFKA_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR}
    volumes:
      - ./scripts/init-kafka-topic.sh:/scripts/init-kafka-topic.sh:ro
    restart: "no"

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    networks: [pipeline-net]
    command: ["--kafka.server=kafka-1:9092", "--kafka.server=kafka-2:9092", "--kafka.server=kafka-3:9092"]
    depends_on:
      kafka-init: { condition: service_completed_successfully }

  # ── CITUS distributed PostgreSQL ────────────────────────────────────────────
  citus-coordinator:
    image: citusdata/citus:12.1
    container_name: citus-coordinator
    hostname: citus-coordinator
    networks: [pipeline-net]
    environment:
      POSTGRES_USER: ${CITUS_USER}
      POSTGRES_PASSWORD: ${CITUS_PASSWORD}
      POSTGRES_DB: ${CITUS_DB}
      PGUSER: ${CITUS_USER}
    ports:
      - "${CITUS_HOST_PORT}:5432"
    volumes:
      - citus-coordinator-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CITUS_USER} -d ${CITUS_DB}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  citus-worker-1:
    image: citusdata/citus:12.1
    container_name: citus-worker-1
    hostname: citus-worker-1
    networks: [pipeline-net]
    environment:
      POSTGRES_USER: ${CITUS_USER}
      POSTGRES_PASSWORD: ${CITUS_PASSWORD}
      POSTGRES_DB: ${CITUS_DB}
      PGUSER: ${CITUS_USER}
    volumes:
      - citus-worker1-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CITUS_USER} -d ${CITUS_DB}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  citus-worker-2:
    image: citusdata/citus:12.1
    container_name: citus-worker-2
    hostname: citus-worker-2
    networks: [pipeline-net]
    environment:
      POSTGRES_USER: ${CITUS_USER}
      POSTGRES_PASSWORD: ${CITUS_PASSWORD}
      POSTGRES_DB: ${CITUS_DB}
      PGUSER: ${CITUS_USER}
    volumes:
      - citus-worker2-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CITUS_USER} -d ${CITUS_DB}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  citus-worker-3:
    image: citusdata/citus:12.1
    container_name: citus-worker-3
    hostname: citus-worker-3
    networks: [pipeline-net]
    environment:
      POSTGRES_USER: ${CITUS_USER}
      POSTGRES_PASSWORD: ${CITUS_PASSWORD}
      POSTGRES_DB: ${CITUS_DB}
      PGUSER: ${CITUS_USER}
    volumes:
      - citus-worker3-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CITUS_USER} -d ${CITUS_DB}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  citus-init:
    image: citusdata/citus:12.1
    container_name: citus-init
    networks: [pipeline-net]
    depends_on:
      citus-coordinator: { condition: service_healthy }
      citus-worker-1: { condition: service_healthy }
      citus-worker-2: { condition: service_healthy }
      citus-worker-3: { condition: service_healthy }
    entrypoint: ["/bin/bash", "/scripts/citus-init.sh"]
    environment:
      PGUSER: ${CITUS_USER}
      PGPASSWORD: ${CITUS_PASSWORD}
      PGDATABASE: ${CITUS_DB}
    volumes:
      - ./scripts/citus-init.sh:/scripts/citus-init.sh:ro
      - ./citus/init:/sql:ro
    restart: "no"

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    networks: [pipeline-net]
    environment:
      DATA_SOURCE_NAME: "postgresql://${CITUS_USER}:${CITUS_PASSWORD}@citus-coordinator:5432/${CITUS_DB}?sslmode=disable"
    depends_on:
      citus-init: { condition: service_completed_successfully }

  # ── SPARK standalone cluster (custom build) ─────────────────────────────────
  spark-master:
    build: ./spark
    container_name: spark-master
    hostname: spark-master
    networks: [pipeline-net]
    environment:
      SPARK_MODE: master
    ports:
      - "8080:8080"
      - "7077:7077"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  spark-worker:
    build: ./spark
    networks: [pipeline-net]
    depends_on:
      spark-master: { condition: service_healthy }
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY}

  stream-processor:
    build: ./spark
    container_name: stream-processor
    networks: [pipeline-net]
    depends_on:
      spark-master: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      citus-init: { condition: service_completed_successfully }
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      CITUS_HOST: citus-coordinator
      CITUS_PORT: 5432
      CITUS_DB: ${CITUS_DB}
      CITUS_USER: ${CITUS_USER}
      CITUS_PASSWORD: ${CITUS_PASSWORD}
      ANOMALY_RATE_PER_SEC_THRESHOLD: ${ANOMALY_RATE_PER_SEC_THRESHOLD}
      SPARK_TRIGGER_INTERVAL_SEC: ${SPARK_TRIGGER_INTERVAL_SEC}
    volumes:
      - ./spark/jobs:/opt/spark-apps:ro
    entrypoint:
      - /opt/spark/bin/spark-submit
      - "--master=spark://spark-master:7077"
      - "--packages=${SPARK_KAFKA_PACKAGE},${SPARK_PG_JDBC_PACKAGE}"
      - "--conf=spark.sql.shuffle.partitions=6"
      - "/opt/spark-apps/streaming_job.py"
    restart: on-failure

  # ── PRODUCER ────────────────────────────────────────────────────────────────
  producer:
    build: ./producer
    container_name: producer
    networks: [pipeline-net]
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      PRODUCER_MODE: ${PRODUCER_MODE}
      PRODUCER_NORMAL_EPS: ${PRODUCER_NORMAL_EPS}
      PRODUCER_BURST_EPS: ${PRODUCER_BURST_EPS}
      PRODUCER_NORMAL_DURATION_SEC: ${PRODUCER_NORMAL_DURATION_SEC}
      PRODUCER_BURST_DURATION_SEC: ${PRODUCER_BURST_DURATION_SEC}
      PRODUCER_BOT_RATIO: ${PRODUCER_BOT_RATIO}
      PRODUCER_CATALOG_SIZE: ${PRODUCER_CATALOG_SIZE}
    volumes:
      - ./control:/control
    restart: on-failure

  # ── MONITORING ──────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks: [pipeline-net]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    networks: [pipeline-net]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - postgres-exporter

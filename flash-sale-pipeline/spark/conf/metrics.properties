# Exposes Spark's internal metrics in Prometheus text format so they can be
# scraped directly from the existing web UI ports (no extra exporter needed).
#   spark-master  -> http://spark-master:8080/metrics/master/prometheus/
#   driver app UI -> http://stream-processor:4040/metrics/prometheus/
#
# This is optional polish for the "Collecting perf metrics" requirement of
# the project; the pipeline works fine even if Prometheus never scrapes it.

*.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
*.sink.prometheusServlet.path=/metrics/prometheus

master.sink.prometheusServlet.path=/metrics/master/prometheus
applications.sink.prometheusServlet.path=/metrics/applications/prometheus

# Enable JVM source metrics (heap usage, GC time, etc.) on every role
master.source.jvm.class=org.apache.spark.metrics.source.JvmSource
worker.source.jvm.class=org.apache.spark.metrics.source.JvmSource
driver.source.jvm.class=org.apache.spark.metrics.source.JvmSource
executor.source.jvm.class=org.apache.spark.metrics.source.JvmSource
